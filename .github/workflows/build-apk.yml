name: Build Navisun Fuel Tracker APK

on:
  push:
    branches:
      - claude/navisun-fuel-tracking-app-MHT50
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Gradle 8.4 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle-dist
          echo "/opt/gradle-dist/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build debug APK
        working-directory: navisun-fuel-tracker
        run: /opt/gradle-dist/gradle-8.4/bin/gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: navisun-yakıt-takibi-apk
          path: navisun-fuel-tracker/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
