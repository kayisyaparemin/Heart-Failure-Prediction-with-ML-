name: Build Navisun Fuel Tracker APK

on:
  push:
    branches:
      - claude/navisun-fuel-tracking-app-MHT50
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Gradle 8.4 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle-dist

      - name: Build debug APK
        working-directory: navisun-fuel-tracker
        run: /opt/gradle-dist/gradle-8.4/bin/gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp navisun-fuel-tracker/app/build/outputs/apk/debug/app-debug.apk navisun-yakıt-takibi.apk

      - name: Delete old release if exists
        run: gh release delete navisun-v1.0 --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        run: |
          gh release create navisun-v1.0 \
            --title "Navisun Yakıt Takibi v1.0" \
            --notes "VW Polo 2010 için Navisun araç multimedya uygulaması. APK dosyasını indirip cihaza yükleyin." \
            --target claude/navisun-fuel-tracking-app-MHT50 \
            "navisun-yakıt-takibi.apk"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
